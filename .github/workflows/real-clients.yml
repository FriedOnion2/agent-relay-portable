name: Real client compatibility
# Imports a synthetic conversation with AgentRelay and opens it with the real, latest client releases on
# Linux, macOS and Windows. Clients that cannot be installed or driven headlessly are reported as skipped,
# and the run summary shows one support table (software x system).
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ['app/relay/adapters/codex.py', 'app/relay/adapters/dsh*.py', 'scripts/smoke_*.py', 'tests/dsh_native_smoke.mjs', '.github/workflows/real-clients.yml']
permissions:
  contents: read
jobs:
  windows-source:
    name: Native round trip - Windows source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install -g @openai/codex
      - run: python scripts/smoke_cross_device.py --phase windows-source --output outgoing
      - uses: actions/upload-artifact@v6
        with:
          name: native-windows-source
          path: outgoing/
          if-no-files-found: error
  ubuntu-restore:
    name: Native round trip - Ubuntu restore and continue
    needs: windows-source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install -g @openai/codex
      - uses: actions/download-artifact@v7
        with:
          name: native-windows-source
          path: incoming
      - run: python scripts/smoke_cross_device.py --phase ubuntu --input incoming --output outgoing
      - uses: actions/upload-artifact@v6
        with:
          name: native-ubuntu-return
          path: outgoing/
          if-no-files-found: error
  windows-return:
    name: Native round trip - Windows return and continue
    needs: ubuntu-restore
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install -g @openai/codex
      - uses: actions/download-artifact@v7
        with:
          name: native-ubuntu-return
          path: incoming
      - run: python scripts/smoke_cross_device.py --phase windows-return --input incoming --output outgoing
      - uses: actions/upload-artifact@v6
        with:
          name: native-windows-return
          path: outgoing/
          if-no-files-found: error
  smoke:
    name: smoke (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os_name: Linux, runner: ubuntu-22.04}
          - {os_name: macOS, runner: macos-latest}
          - {os_name: Windows, runner: windows-latest}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-optional.txt
      # A client that fails to install on this system is reported as a skip by smoke_all.py, not as a failure.
      - name: Install Codex
        continue-on-error: true
        run: npm install -g @openai/codex
      - name: Install DSH
        continue-on-error: true
        run: npm install -g @deepseek-ai/dsh
      - name: Run smoke tests
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/smoke_all.py --json smoke-${{ matrix.os_name }}.json
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-${{ matrix.os_name }}
          path: smoke-${{ matrix.os_name }}.json
          if-no-files-found: ignore
  summary:
    needs: smoke
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: smoke-*
          path: results
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/smoke_table.py results >> "$GITHUB_STEP_SUMMARY"
  alert:
    needs: smoke
    # Only scheduled runs open issues; manual and push runs are watched by whoever started them.
    if: always() && github.event_name == 'schedule' && needs.smoke.result == 'failure'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: smoke-*
          path: results
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/smoke_table.py results > table.md || true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/drift_issue.py --workflow "Real client compatibility" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --details-file table.md
