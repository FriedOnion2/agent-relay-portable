name: Build and publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (e.g. v0.5.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify-tag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Tag matches __version__ and CHANGELOG has release notes
        run: python3 scripts/release_notes.py --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/notes.md"
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  build:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-14
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-release.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/web.test.cjs
      - name: Build and test standalone runtime
        shell: bash
        run: python scripts/build_release.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v6
        with:
          name: runtime-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
  assemble:
    needs: build
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          pattern: runtime-*
          path: runtime-assets
          merge-multiple: true
      - name: Assemble the single cross-device download
        run: python scripts/assemble_release.py --tag "$RELEASE_TAG" --assets runtime-assets --output dist/universal
      - name: Check universal launchers
        run: |
          bash -n dist/universal/AgentRelay-*/启动_AgentRelay.command
          bash -n dist/universal/AgentRelay-*/启动_AgentRelay.sh
          bash -n dist/universal/AgentRelay-*/AgentRelay.app/Contents/MacOS/AgentRelay
      - name: Validate universal Mac launcher and shared storage
        run: python scripts/smoke_universal.py dist/universal/AgentRelay-*-universal.zip
      - uses: actions/upload-artifact@v6
        with:
          name: universal-release
          path: |
            dist/universal/*.zip
            dist/universal/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
  validate-universal:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: universal-release
          path: universal-assets
      - name: Verify the complete download on this device
        shell: bash
        run: python scripts/smoke_universal.py universal-assets/*.zip
  publish:
    needs: validate-universal
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v7
        with:
          name: universal-release
          path: universal-assets
      - name: Render release notes from CHANGELOG
        run: python3 scripts/release_notes.py --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/notes.md"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: universal-assets/*.zip
      - name: Publish release only after every platform passes
        run: |
          flags=()
          case "$RELEASE_TAG" in *-*) flags+=(--prerelease);; esac
          gh release create "$RELEASE_TAG" universal-assets/*.zip universal-assets/SHA256SUMS.txt --verify-tag "${flags[@]}" --title "AgentRelay $RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
