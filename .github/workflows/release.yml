name: Build and publish release
# 两种产物（规则见 docs/maintainers.md）：
#   * 推送 vX.Y.Z 标签 → 正式版 Release；
#   * 推送到 main（或手动运行且不填 tag）→ 滚动开发版：固定 tag `dev`，每次重建并替换，始终只有一个。
on:
  push:
    tags: ['v*']
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', 'LICENSE']
  workflow_dispatch:
    inputs:
      tag:
        description: 正式版标签（如 v0.5.0）；留空则按当前分支构建滚动开发版
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.ref_type == 'branch' && inputs.tag == '' }}
jobs:
  meta:
    runs-on: ubuntu-22.04
    outputs:
      mode: ${{ steps.meta.outputs.mode }}
      label: ${{ steps.meta.outputs.label }}
      ref: ${{ steps.refs.outputs.ref }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - id: refs
        run: |
          if [ -n "$INPUT_TAG" ]; then ref="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then ref="$GITHUB_REF_NAME"
          else ref="$GITHUB_SHA"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
        env:
          INPUT_TAG: ${{ inputs.tag }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.refs.outputs.ref }}
      - name: Decide stable vs rolling dev; validate version and CHANGELOG notes
        id: meta
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$REF" == v* ]]; then arg=(--tag "$REF"); else arg=(--sha "$sha"); fi
          python3 scripts/release_notes.py "${arg[@]}" --meta | tee -a "$GITHUB_OUTPUT"
          python3 scripts/release_notes.py "${arg[@]}" --repo "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/notes.md"
        env:
          REF: ${{ steps.refs.outputs.ref }}
  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-14
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.meta.outputs.label }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-release.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/web.test.cjs
      - name: Build and test standalone runtime
        shell: bash
        run: python scripts/build_release.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v6
        with:
          name: runtime-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
  assemble:
    needs: [meta, build]
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ needs.meta.outputs.label }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          pattern: runtime-*
          path: runtime-assets
          merge-multiple: true
      - name: Assemble the single cross-device download
        run: python scripts/assemble_release.py --tag "$RELEASE_TAG" --assets runtime-assets --output dist/universal
      - name: Check universal launchers
        run: |
          bash -n dist/universal/AgentRelay-*/启动_AgentRelay.command
          bash -n dist/universal/AgentRelay-*/启动_AgentRelay.sh
          bash -n dist/universal/AgentRelay-*/AgentRelay.app/Contents/MacOS/AgentRelay
      - name: Validate universal Mac launcher and shared storage
        run: python scripts/smoke_universal.py dist/universal/AgentRelay-*-universal.zip
      - uses: actions/upload-artifact@v6
        with:
          name: universal-release
          path: |
            dist/universal/*.zip
            dist/universal/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
  validate-universal:
    needs: [meta, assemble]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: universal-release
          path: universal-assets
      - name: Verify the complete download on this device
        shell: bash
        run: python scripts/smoke_universal.py universal-assets/*.zip
  publish:
    needs: [meta, validate-universal]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.meta.outputs.label }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: universal-release
          path: universal-assets
      - name: Render release notes
        run: |
          if [ "$MODE" = dev ]; then arg=(--sha "$SHA"); else arg=(--tag "$RELEASE_TAG"); fi
          python3 scripts/release_notes.py "${arg[@]}" --repo "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/notes.md"
        env:
          MODE: ${{ needs.meta.outputs.mode }}
          SHA: ${{ needs.meta.outputs.sha }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: universal-assets/*.zip
      - name: Publish stable release only after every platform passes
        if: needs.meta.outputs.mode == 'stable'
        run: |
          gh release create "$RELEASE_TAG" universal-assets/*.zip universal-assets/SHA256SUMS.txt --verify-tag --latest --title "AgentRelay $RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Replace the rolling dev release (there is only ever one)
        if: needs.meta.outputs.mode == 'dev'
        run: |
          # 平台全部验证通过之后才替换；失败时保留上一个开发版
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev universal-assets/*.zip universal-assets/SHA256SUMS.txt --target "$SHA" --prerelease --title "AgentRelay dev（滚动开发版 $RELEASE_TAG）" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          SHA: ${{ needs.meta.outputs.sha }}
