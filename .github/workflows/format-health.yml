name: Format health (synthetic fixtures)
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/relay/**', 'tests/**', '.github/workflows/format-health.yml']
permissions:
  contents: read
jobs:
  health:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-optional.txt
      - run: python app/cli.py health --output health-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: format-health-${{ matrix.os }}
          path: health-output/
          if-no-files-found: error
          retention-days: 30
