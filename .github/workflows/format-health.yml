name: Format health (synthetic fixtures)
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/relay/**', 'tests/**', '.github/workflows/format-health.yml']
permissions:
  contents: read
jobs:
  health:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-optional.txt
      - run: python app/cli.py health --output health-output
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: format-health-${{ matrix.os }}
          path: health-output/
          if-no-files-found: error
          retention-days: 30
  alert:
    needs: health
    if: always() && github.event_name == 'schedule' && needs.health.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/drift_issue.py --workflow "Format health (synthetic fixtures)" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
