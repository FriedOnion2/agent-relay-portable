name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.8', '3.12', '3.14']
        exclude:
          - os: macos-latest
            python: '3.8'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-optional.txt
      - name: Prepare Ubuntu isolated runtime
        if: runner.os == 'Linux'
        env:
          RELAY_VENV: ${{ runner.temp }}/relay venv
        run: |
          bash Ubuntu首次准备.sh
          "$RELAY_VENV/bin/python3" -c 'import zstandard'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/web.test.cjs
      - name: Check Linux and macOS shell scripts
        if: runner.os != 'Windows'
        run: |
          bash -n 启动_AgentRelay.command
          bash -n Mac首次准备.command
          bash -n Mac安装依赖.command
          bash -n AgentRelay.app/Contents/MacOS/AgentRelay
          bash -n 启动_AgentRelay.sh
          bash -n Ubuntu首次准备.sh
          bash -n app/linux-common.sh
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-optional.txt coverage==7.16.2
      - name: Run tests with coverage (fails below the threshold in pyproject.toml)
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report
          python -m coverage xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
  package:
    name: pip install (wheel)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and install the wheel into a clean venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pkg"
          BIN="$RUNNER_TEMP/pkg/bin"; [ -d "$BIN" ] || BIN="$RUNNER_TEMP/pkg/Scripts"
          "$BIN/python" -m pip install .
          "$BIN/relay" --version
          "$BIN/agent-relay" --version
          "$BIN/python" -c "import relay_web, os; p = list(relay_web.__path__)[0]; assert os.path.isfile(os.path.join(p, 'index.html')), p"
