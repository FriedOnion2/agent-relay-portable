name: 功能建议 / Feature request
description: 新来源、新能力或体验改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
