<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentRelay · 对话记录迁移</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --line:#e3e6ec; --line-soft:#eef0f4;
    --text:#1c2024; --text-2:#5b6470; --text-3:#8b95a3;
    --accent:#2563eb; --accent-soft:#eaf1ff; --accent-line:#c7dbff;
    --green:#0f8a4d; --green-soft:#e7f6ee;
    --amber:#b7791f; --amber-soft:#fdf3e2;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.6 "Segoe UI","Microsoft YaHei",-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}

  /* ---------- 顶栏 ---------- */
  header{
    height:56px; display:flex; align-items:center; gap:14px;
    padding:0 18px; background:var(--panel); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  .logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:.2px;flex:none}
  .logo svg{flex:none}
  .tagline{color:var(--text-3);font-size:12.5px}
  .agent-chips{display:flex;gap:6px;margin-left:auto;align-items:center;min-width:0;overflow-x:auto}
  header > .btn,.agent-chips .chip{flex:none}
  @media(max-width:1200px){.tagline{display:none}}
  @media(max-width:560px){header{gap:6px;padding:0 8px}.agent-chips{display:none}header > .btn{padding:7px 8px}#btnStorage{margin-left:auto}}
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
    background:var(--line-soft); font-size:12px; color:var(--text-2); border:1px solid transparent;
  }
  .chip b{font-weight:600;color:var(--text)}
  .chip.off{opacity:.45}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
  .chip.off .dot{background:#c2c8d0}

  /* ---------- 布局 ---------- */
  .wrap{display:flex; height:calc(100vh - 56px); overflow:hidden}
  aside{
    width:340px; flex:none; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column;
  }
  main{flex:1; display:flex; flex-direction:column; min-width:0}
  #content{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}

  /* ---------- 侧栏 ---------- */
  .tabs{display:flex; flex-wrap:wrap; gap:4px; padding:12px 12px 8px; border-bottom:1px solid var(--line-soft)}
  .tab{
    flex:1; padding:7px 4px; border-radius:8px; border:1px solid transparent; background:transparent;
    cursor:pointer; color:var(--text-2); font-size:13px; transition:.15s; text-align:center;
  }
  .tab:hover{background:var(--line-soft)}
  .tab.on{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line); font-weight:600}
  .side-tools{padding:10px 12px; border-bottom:1px solid var(--line-soft)}
  .input{width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; outline:none}
  .input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .list{flex:1; overflow-y:auto; padding:8px}
  .item{
    padding:10px 11px; border-radius:var(--radius); border:1px solid transparent; cursor:pointer;
    margin-bottom:6px; background:#fff; transition:.12s;
  }
  .item:hover{border-color:var(--line); background:#fbfcfe}
  .item.on{border-color:var(--accent-line); background:var(--accent-soft)}
  .item h4{margin:0 0 5px; font-size:13px; font-weight:600; line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item .meta{display:flex;gap:8px;font-size:11.5px;color:var(--text-3);flex-wrap:wrap}
  .item .meta span{white-space:nowrap}
  .empty{padding:28px 14px;text-align:center;color:var(--text-3);font-size:13px}

  /* ---------- 主区 ---------- */
  .bar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  .bar .spacer{flex:1}
  .btn{
    padding:7px 13px; border-radius:8px; border:1px solid var(--line); background:#fff;
    cursor:pointer; transition:.12s; white-space:nowrap;
  }
  .btn:hover:not(:disabled){border-color:#c9cfd8; background:#fafbfc}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500}
  .btn.primary:hover:not(:disabled){background:#1d4fd8}
  .sel, .bar .input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none}
  .sel:focus,.bar .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  label.opt{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text-2);cursor:pointer}
  label.opt input{margin:0}

  .hero{padding:14px 18px 12px; background:var(--panel); border-bottom:1px solid var(--line-soft)}
  .hero h2{margin:0 0 6px; font-size:16px; font-weight:600}
  .hero .sub{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-3)}
  .hero .sub code{background:var(--line-soft);padding:1px 5px;border-radius:4px;font-size:11.5px}
  .warn{margin-top:8px;font-size:12.5px;color:var(--amber);background:var(--amber-soft);
    border:1px solid #f3e0bd;border-radius:7px;padding:6px 9px}

  .feed{flex:1; overflow-y:auto; padding:18px}
  .turn{display:flex;gap:11px;margin-bottom:16px;max-width:1000px}
  .avatar{
    width:28px;height:28px;flex:none;border-radius:8px;display:grid;place-items:center;
    font-size:13px;font-weight:600;
  }
  .u .avatar{background:var(--accent-soft);color:var(--accent)}
  .a .avatar{background:var(--green-soft);color:var(--green)}
  .bubble{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:11px 13px;box-shadow:var(--shadow)}
  .bubble .who{font-size:11.5px;color:var(--text-3);margin-bottom:5px;display:flex;gap:8px}
  .bubble .body{white-space:pre-wrap;word-break:break-word;font-size:13.5px}
  details{margin:7px 0}
  details summary{cursor:pointer;color:var(--text-2);font-size:12.5px;user-select:none}
  details .think{padding:9px 11px;background:#fafbfc;border:1px dashed var(--line);border-radius:8px;
    margin-top:6px;white-space:pre-wrap;font-size:12.5px;color:var(--text-2)}
  .tool{margin:7px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fcfdfe}
  .tool>.hd{padding:6px 10px;background:#f7f9fc;border-bottom:1px solid var(--line-soft);
    font-size:12px;color:var(--text-2);display:flex;gap:8px;align-items:center}
  .tool>.hd b{color:var(--text);font-weight:600}
  .tool pre{margin:0;padding:9px 11px;overflow-x:auto;font-size:12px;line-height:1.55;color:#2c333d}
  code.k{font-family:"Cascadia Mono",Consolas,Menlo,monospace}

  /* ---------- 反馈 ---------- */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:#111827;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.22);opacity:0;transition:.22s;z-index:99;max-width:70vw;
    display:flex;gap:10px;align-items:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.bad{background:#8f2d2d}
  .toast button{background:rgba(255,255,255,.16);border:0;color:#fff;padding:4px 9px;border-radius:6px;cursor:pointer}
  .spinner{
    width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
    border-radius:50%;animation:sp .7s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .placeholders{display:grid;place-items:center;height:100%;color:var(--text-3);font-size:13.5px;text-align:center;padding:20px}
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
    <path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    AgentRelay
  </div>
  <span class="tagline">读取 WorkBuddy · DSH · CodeBuddy · Claude Code / Agent SDK · Codex 会话</span>
  <div class="agent-chips" id="chips"></div>
  <button class="btn" id="btnStorage">对话存储</button>
  <button class="btn" id="btnSkillStorage">Skill 存储</button>
  <button class="btn" id="btnExit" title="停止当前后台服务">退出服务</button>
</header>

<div class="wrap">
  <aside>
    <div class="tabs" id="tabs"></div>
    <div id="sourceNote" class="meta" style="padding:8px 12px;display:none"></div>
    <div class="side-tools">
      <input class="input" id="q" placeholder="搜索标题 / 目录 / id…" autocomplete="off">
    </div>
    <div class="list" id="list"><div class="empty">加载中…</div></div>
  </aside>

  <main>
    <div class="bar">
      <select class="sel" id="target"></select>
      <input class="input" id="cwd" style="width:290px" placeholder="目标工作目录（留空沿用原会话）">
      <input class="input" id="projectPath" style="display:none;width:290px" placeholder="同一项目在 Ubuntu 中的挂载路径 /mnt/…">
      <input class="input" id="importId" style="display:none;width:190px" placeholder="新会话 ID（可选）">
      <button class="btn" id="btnNewId" style="display:none">生成新 ID</button>
      <label class="opt"><input type="checkbox" id="remap" checked>工具名适配</label>
      <label class="opt"><input type="checkbox" id="think" checked>保留思考</label>
      <div class="spacer"></div>
      <button class="btn" id="btnMd" disabled>导出 Markdown</button>
      <button class="btn" id="btnStore" disabled>存储此会话</button>
      <button class="btn primary" id="btnImport" style="display:none" disabled>迁到 Ubuntu 对应软件</button>
      <button class="btn primary" id="btnGo" disabled>迁移到目标</button>
    </div>

    <div id="importResult" class="meta" style="display:none;padding:12px 20px;white-space:pre-wrap"></div>

    <div id="content">
      <div class="placeholders">
        从左侧选一个会话<br>支持预览、Markdown 导出和迁移到可写目标
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<section id="storagePanel" style="display:none;position:fixed;inset:70px 24px 24px;z-index:80;background:var(--bg,#fff);padding:20px;overflow:auto;border:1px solid #bbb;border-radius:12px">
  <div class="bar"><b>跨设备对话存储</b><button class="btn" id="closeStorage">关闭</button></div>
  <p>按 Agent 保存原生 ZIP 包。把 storage 文件夹复制到另一台设备，或填写包路径后恢复。同 ID 不覆盖，恢复到对应软件。</p>
  <div class="bar">
    <input class="input" id="storageRoot" placeholder="存储目录（留空使用项目 storage/）" style="width:380px">
    <button class="btn" id="refreshStorage">刷新存储列表</button>
  </div>
  <div class="bar">
    <input class="input" id="packagePath" placeholder="会话包 .zip 路径" style="width:380px">
    <input class="input" id="restoreCwd" placeholder="本机已存在的目标项目目录">
    <input class="input" id="restoreId" placeholder="新 UUID（可选，避免同 ID 冲突）">
    <button class="btn primary" id="restorePackage">恢复到对应软件</button>
  </div>
  <div id="storageResult" class="meta" style="white-space:pre-wrap;padding:12px"></div>
  <div id="storageList"></div>
</section>
<section id="skillPanel" style="display:none;position:fixed;inset:70px 24px 24px;z-index:81;background:var(--bg,#fff);padding:20px;overflow:auto;border:1px solid #bbb;border-radius:12px">
  <div class="bar"><b>跨设备 Skill 存储</b><button class="btn" id="closeSkills">关闭</button></div>
  <p>保存完整 SKILL.md、脚本和资源目录。复制 ZIP 到目标设备后恢复；已有同名 Skill 不覆盖，脚本不会自动执行。</p>
  <div class="bar">
    <select class="sel" id="skillAgent"></select>
    <input class="input" id="skillsDir" placeholder="源 Skill 根目录（可选；未发现时填实际目录）" style="width:360px">
    <button class="btn" id="discoverSkills">查找 Skill</button>
  </div>
  <div class="bar">
    <input class="input" id="skillPath" placeholder="待保存的完整 Skill 目录，须含 SKILL.md" style="width:380px">
    <input class="input" id="skillStorageRoot" placeholder="存储目录（留空使用项目 storage/）">
    <button class="btn" id="storeSkill">存储 Skill</button>
    <button class="btn" id="refreshSkillPackages">刷新已存储 Skill</button>
  </div>
  <div id="skillList"></div>
  <div class="bar">
    <input class="input" id="skillPackage" placeholder="Skill 包 .zip 路径" style="width:380px">
    <select class="sel" id="skillTargetAgent"></select>
    <input class="input" id="targetSkillsDir" placeholder="目标设备的实际 Skill 根目录（可选）">
    <input class="input" id="skillName" placeholder="新目录名（可选）">
    <button class="btn primary" id="restoreSkill">恢复 Skill</button>
  </div>
  <div id="skillResult" class="meta" style="white-space:pre-wrap;padding:12px"></div>
  <div id="skillPackages"></div>
</section>

<script>
const AGENTS = {workbuddy:'WorkBuddy', dsh:'DeepSeek Harness', codebuddy:'CodeBuddy', claude:'Claude Code', claude_sdk:'Claude Agent SDK', codex:'OpenAI Codex'};
const state = {source:'workbuddy', target:'claude', sources:[], sessions:[], current:null, turnLimit:40,
  listRequest:0, sessionRequest:0, transferring:false};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(url, options){
  const response = await fetch(url, options);
  const result = await response.json();
  if(!response.ok || !result.ok) throw new Error(result.error || `请求失败 (${response.status})`);
  return result;
}

function nativeMode(source=state.source){
  if(source.startsWith('windows_')) return 'import-windows';
  if(source.startsWith('ubuntu_')) return 'import-ubuntu';
  return state.sources.find(s=>s.name===source)?.native_export ? 'export-windows' : '';
}

function updateActions(){
  $('#btnExit').disabled = state.transferring;
  $('#btnGo').disabled = !state.current || state.current.truncated || !state.target || state.transferring;
  const mode = nativeMode();
  const native = !!mode;
  $('#btnImport').style.display = native ? '' : 'none';
  $('#importId').style.display = native ? '' : 'none';
  $('#btnNewId').style.display = native ? '' : 'none';
  $('#projectPath').style.display = mode==='export-windows' ? '' : 'none';
  if(!state.transferring) $('#btnImport').textContent = mode==='import-windows' ? '迁到 Ubuntu 对应软件' : '迁到 Windows 对应软件';
  $('#btnImport').title = '对应软件迁移保留完整原生记录；工具名适配与保留思考勾选项仅用于通用迁移';
  $('#btnImport').disabled = !native || !state.current || state.current.truncated ||
    !$('#cwd').value.trim() || (mode==='export-windows' && !$('#projectPath').value.trim()) || state.transferring;
  $('#btnMd').disabled = !state.current;
  $('#btnStore').disabled = !state.current || state.current.truncated || state.transferring;
}

function toast(msg, bad=false, action=null){
  const t = $('#toast');
  t.className = 'toast show' + (bad ? ' bad' : '');
  t.innerHTML = '';
  t.appendChild(document.createTextNode(msg));
  if (action){
    const b = document.createElement('button');
    b.textContent = action.label;
    b.onclick = action.fn;
    t.appendChild(b);
  }
  clearTimeout(t._t);
  t._t = setTimeout(()=>{ t.className = 'toast' + (bad?' bad':''); }, action ? 7000 : 3200);
}

/* ================= 初始化 ================= */
async function init(){
  await loadSources();
  buildTabs();
  buildTarget();
  bind();
  await loadSessions();
}

async function loadSources(){
  const r = await api('/api/sources');
  state.sources = r.sources || [];
  const box = $('#chips'); box.innerHTML = '';
  (r.sources || []).forEach(s=>{
    const el = document.createElement('span');
    el.className = 'chip' + (s.available ? '' : ' off');
    el.title = [s.homes ? s.homes.join('\n') : s.home, s.read_note, s.write_note, s.error].filter(Boolean).join('\n');
    el.innerHTML = `<i class="dot"></i>${esc(s.label||s.name)}${s.can_write===false?'（只读）':''} <b>${s.session_count||0}</b>`;
    box.appendChild(el);
  });
  if (!state.listRequest && !(r.sources||[]).some(s=>s.available && s.name===state.source)){
    const first = (r.sources||[]).find(s=>s.available);
    if (first) state.source = first.name;
  }
}

function buildTabs(){
  const box = $('#tabs'); box.innerHTML='';
  const note = state.sources.find(s=>s.name===state.source)?.read_note ||
    (state.source==='claude_sdk'?'SDK 与 Claude Code 共用会话存储；此入口显示共享记录，无法仅凭日志确认创建者。':'');
  const sourceInfo = state.sources.find(s=>s.name===state.source);
  const location = sourceInfo?.homes?.join('；') || sourceInfo?.home || '';
  const fullNote = [note, location ? '读取路径：' + location : '', sourceInfo?.error].filter(Boolean).join('\n');
  $('#sourceNote').textContent = fullNote;
  $('#sourceNote').style.display = fullNote ? '' : 'none';
  const labels = {...AGENTS};
  state.sources.forEach(s=>{ labels[s.name] = s.label || s.name; });
  Object.keys(labels).forEach(k=>{
    const b = document.createElement('button');
    b.className = 'tab' + (k===state.source?' on':'');
    b.textContent = labels[k];
    b.onclick = ()=>{ if(state.source===k) return; state.source=k; buildTabs(); loadSessions(); };
    box.appendChild(b);
  });
}

function buildTarget(){
  const sel = $('#target'); sel.innerHTML='';
  const opts = Object.keys(AGENTS).filter(k=>k!==state.source &&
    (state.sources.find(s=>s.name===k)?.can_write ?? ['workbuddy','dsh','claude','codex'].includes(k)));
  const same = state.source.replace(/^(windows_|ubuntu_)/,'');
  state.target = opts.includes(same) ? same : (opts.includes(state.target) ? state.target : opts[0]);
  opts.forEach(k=>{
    const o = document.createElement('option');
    o.value = k; o.textContent = '迁移到 ' + AGENTS[k];
    sel.appendChild(o);
  });
  sel.value = state.target;
  updateActions();
}

async function exitService(){
  const btn = $('#btnExit');
  if(state.transferring || btn.disabled) return;
  if(!confirm('停止当前 AgentRelay 服务？其他使用此服务的页面也会断开。')) return;
  btn.disabled = true;
  try{
    await api('/api/shutdown', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
    document.body.innerHTML = '<main style="padding:40px"><h2>AgentRelay 正在退出</h2><p>服务将在正在执行的请求结束后停止。可以关闭此页面；再次使用请重新运行启动器。</p></main>';
  }catch(e){
    toast('退出失败：'+e.message, true);
    btn.disabled = false;
  }
}

function bind(){
  $('#btnExit').onclick = exitService;
  $('#btnSkillStorage').onclick = ()=>{
    $('#skillPanel').style.display=''; buildSkillAgents();
    $('#skillStorageRoot').value=$('#storageRoot').value;
    loadSkills(); refreshSkillPackages();
  };
  $('#closeSkills').onclick = ()=>{$('#skillPanel').style.display='none';};
  $('#discoverSkills').onclick=loadSkills;
  $('#skillAgent').onchange=loadSkills;
  $('#storeSkill').onclick=storeSelectedSkill;
  $('#refreshSkillPackages').onclick=refreshSkillPackages;
  $('#restoreSkill').onclick=restoreSelectedSkill;
  $('#btnStore').onclick = storeCurrent;
  $('#btnStorage').onclick = ()=>{ $('#storagePanel').style.display=''; refreshStorage(); };
  $('#closeStorage').onclick = ()=>{ $('#storagePanel').style.display='none'; };
  $('#refreshStorage').onclick = refreshStorage;
  $('#restorePackage').onclick = restoreStored;
  $('#target').onchange = e => {state.target = e.target.value; updateActions();};
  $('#cwd').oninput = updateActions;
  $('#projectPath').oninput = updateActions;
  let timer;
  $('#q').oninput = e => { clearTimeout(timer); timer = setTimeout(loadSessions, 260); };
  $('#btnGo').onclick = doTransfer;
  $('#btnImport').onclick = doImportWindows;
  $('#btnNewId').onclick = ()=>{
    const id = globalThis.crypto?.randomUUID?.();
    if(id) $('#importId').value = id;
    else toast('当前浏览器不能生成 UUID，请手动填写新会话 ID',true);
  };
  $('#btnMd').onclick = async ()=>{
    if(!state.current) return;
    const selected = state.current;
    try{
      const r = await api('/api/export-md', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({source:selected.source, id:selected.id,
          include_thinking:$('#think').checked, include_tools:true})
      });
      download(`${(selected.title||'session').slice(0,40).replace(/[<>:"/\\|?*\x00-\x1f]/g,'_')}.md`, r.markdown);
      toast('Markdown 已下载');
    }catch(e){ toast('导出失败：'+e.message, true); }
  };
}

/* ================= 列表 ================= */
async function loadSessions(){
  const request = ++state.listRequest;
  const source = state.source;
  ++state.sessionRequest;
  state.current = null;
  updateActions();
  $('#content').innerHTML = '<div class="placeholders">从左侧选一个会话</div>';
  $('#cwd').value = '';
  $('#projectPath').value = '';
  $('#importId').value = '';
  $('#importResult').style.display = 'none';
  const box = $('#list');
  box.innerHTML = '<div class="empty">加载中…</div>';
  buildTarget();
  const q = encodeURIComponent($('#q').value.trim());
  let r;
  try{
    r = await api(`/api/sessions?agent=${source}&q=${q}`);
  }catch(e){
    if(request === state.listRequest) box.innerHTML = `<div class="empty">请求失败：${esc(e.message)}</div>`;
    return;
  }
  if(request !== state.listRequest || source !== state.source) return;
  state.sessions = r.sessions || [];
  box.innerHTML = '';
  if(!state.sessions.length){
    box.innerHTML = '<div class="empty">没有会话<br><span style="font-size:12px">换一个 agent 试试</span></div>';
    return;
  }
  state.sessions.forEach(s=>{
    const el = document.createElement('div');
    el.className = 'item';
    el.dataset.id = s.id;
    el.innerHTML = `
      <h4>${esc(s.title || '未命名会话')}</h4>
      <div class="meta">
        <span title="更新时间">${esc(s.updated)}</span>
        <span>${s.readable===false?'读取受限':s.turns+' 轮'}</span>
        ${s.shared_store?'<span>Claude 共享记录</span>':''}
        <span>${esc(s.size_str)}</span>
      </div>`;
    el.title = `${s.id}\n${s.cwd||''}\n${s.path}\n${s.error||''}`;
    el.onclick = ()=>{
      document.querySelectorAll('.item.on').forEach(x=>x.classList.remove('on'));
      el.classList.add('on');
      openSession(s);
    };
    box.appendChild(el);
  });
}

/* ================= 详情 ================= */
async function openSession(s){
  const request = ++state.sessionRequest;
  const source = state.source;
  state.current = null;
  updateActions();
  const main = $('#content');
  if(s.readable===false){
    main.innerHTML = `<div class="placeholders">${esc(s.error||'此会话暂时无法读取')}</div>`;
    return;
  }
  main.innerHTML = '<div class="placeholders">读取中…</div>';
  $('#btnGo').disabled = true; $('#btnMd').disabled = true;
  let r;
  try{
    r = await api(`/api/session?agent=${source}&id=${encodeURIComponent(s.id)}`);
  }catch(e){
    if(request === state.sessionRequest) main.innerHTML = `<div class="placeholders">读取失败：${esc(e.message)}</div>`;
    return;
  }
  if(request !== state.sessionRequest || source !== state.source) return;

  state.current = {id:s.id, title:r.info.title, truncated:!!r.info.truncated, source};
  $('#cwd').placeholder = nativeMode(source)==='import-windows' ? '迁出必填：Ubuntu 项目目录 /home/…' :
    (nativeMode(source) ? 'Windows 项目路径 D:\\project' :
    (r.info.cwd ? `原目录：${r.info.cwd}` : '目标工作目录'));
  updateActions();

  const i = r.info, st = i.stats || {};
  const hero = document.createElement('div');
  hero.className = 'hero';
  hero.innerHTML = `
    <h2>${esc(i.title || '未命名会话')}</h2>
    <div class="sub">
      <span>来源 <b>${esc(i.source)}</b></span>
      <span>${st.turns||0} 轮 · 工具 ${st.tool_call||0} · 思考 ${st.thinking||0}</span>
      ${i.model ? `<span>模型 <code>${esc(i.model)}</code></span>` : ''}
      ${i.created_at ? `<span>${esc(i.created_at)} → ${esc(i.updated_at||'')}</span>` : ''}
    </div>
    ${i.truncated ? '<div class="warn">源文件超过读取限制，仅支持导出已读取的部分内容，迁移已禁用。</div>' : ''}
    ${(i.notes||[]).map(n=>`<div class="warn">${esc(n)}</div>`).join('')}
  `;

  const feed = document.createElement('div');
  feed.className = 'feed';
  const shown = r.turns.slice(0, state.turnLimit);
  shown.forEach(t=>feed.appendChild(renderTurn(t)));
  if(r.turns.length > shown.length){
    const more = document.createElement('button');
    more.className = 'btn';
    more.style.margin = '0 auto';
    more.textContent = `显示剩余 ${r.turns.length - shown.length} 轮`;
    more.onclick = ()=>{
      const rest = document.createDocumentFragment();
      r.turns.slice(state.turnLimit).forEach(t=>rest.appendChild(renderTurn(t)));
      feed.insertBefore(rest, more);
      more.remove();
    };
    feed.appendChild(more);
  }

  main.innerHTML = '';
  main.appendChild(hero);
  main.appendChild(feed);
}

function renderTurn(t){
  const el = document.createElement('div');
  el.className = 'turn ' + (t.role === 'user' ? 'u' : 'a');
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = t.role === 'user' ? 'U' : t.role === 'system' ? 'S' : 'A';
  const bub = document.createElement('div');
  bub.className = 'bubble';

  const who = document.createElement('div');
  who.className = 'who';
  who.innerHTML = `<span>${t.role === 'user' ? '用户' : t.role === 'system' ? '系统 / 上下文' : '助手'}</span>${t.ts ? `<span>${esc(t.ts)}</span>`:''}${t.model?`<span>${esc(t.model)}</span>`:''}`;
  bub.appendChild(who);

  const blocks = t.blocks || [];
  if(!blocks.length){
    const b = document.createElement('div');
    b.className = 'body';
    b.textContent = t.text || '(空)';
    bub.appendChild(b);
  }
  blocks.forEach(b=>bub.appendChild(renderBlock(b)));
  el.appendChild(av); el.appendChild(bub);
  return el;
}

function renderBlock(b){
  if(b.kind === 'text'){
    const d = document.createElement('div');
    d.className = 'body';
    d.textContent = b.text;
    return d;
  }
  if(b.kind === 'thinking'){
    const d = document.createElement('details');
    d.innerHTML = '<summary>💭 思考过程</summary>';
    const p = document.createElement('div');
    p.className = 'think';
    p.textContent = b.text;
    d.appendChild(p);
    return d;
  }
  if(b.kind === 'tool_call'){
    const d = document.createElement('div');
    d.className = 'tool';
    const arg = b.arguments && b.arguments.length > 600 ? b.arguments.slice(0,600)+'\n… 已截断' : b.arguments;
    d.innerHTML = `<div class="hd">🔧 <b>${esc(b.name)}</b><code class="k">${esc((b.call_id||'').slice(0,24))}</code></div>`;
    const pre = document.createElement('pre');
    pre.textContent = arg || '';
    d.appendChild(pre);
    return d;
  }
  if(b.kind === 'tool_result'){
    const d = document.createElement('div');
    d.className = 'tool';
    d.innerHTML = `<div class="hd">${b.is_error?'❌':'📤'} 工具结果<code class="k">${esc((b.call_id||'').slice(0,24))}</code></div>`;
    const pre = document.createElement('pre');
    let out = b.output || '';
    if(out.length > 1500) out = out.slice(0,1500) + `\n… 已截断（共 ${out.length} 字符）`;
    pre.textContent = out;
    d.appendChild(pre);
    return d;
  }
  if(b.kind === 'raw'){
    const d = document.createElement('details');
    d.innerHTML = '<summary>原始内容块（保留未转换字段）</summary>';
    const pre = document.createElement('pre');
    const raw = JSON.stringify(b.meta || {}, null, 2);
    pre.textContent = raw.length > 12000 ? raw.slice(0,12000)+'\n… 预览已截断，导出可查看完整内容' : raw;
    d.appendChild(pre);
    return d;
  }
  const d = document.createElement('div');
  d.className = 'body';
  d.style.color = 'var(--text-3)';
  d.textContent = b.kind === 'image' ? '（图片）' : `（未知块 ${b.kind}）`;
  return d;
}

/* ================= 迁移 ================= */
function buildSkillAgents(){
  const source=$('#skillAgent'),target=$('#skillTargetAgent');
  source.innerHTML=''; target.innerHTML='';
  const labels={...AGENTS};
  state.sources.filter(s=>/^(windows_|ubuntu_)/.test(s.name)).forEach(s=>{labels[s.name]=s.label||s.name;});
  for(const [key,label] of Object.entries(labels)){
    const option=document.createElement('option');option.value=key;option.textContent=label;source.appendChild(option);
  }
  for(const [key,label] of Object.entries(AGENTS)){
    const option=document.createElement('option');option.value=key;option.textContent=label;target.appendChild(option);
  }
  source.value=state.source in labels ? state.source : 'codex';
  target.value=state.source.replace(/^(windows_|ubuntu_)/,'');
}

async function loadSkills(){
  const agent=$('#skillAgent').value;
  try{
    const r=await api('/api/skills?agent='+encodeURIComponent(agent)+'&skills_dir='+encodeURIComponent($('#skillsDir').value.trim()));
    if(agent!==$('#skillAgent').value) return;
    const box=$('#skillList');box.innerHTML='';
    const note=document.createElement('div');note.className='meta';note.style.padding='10px';
    note.textContent='扫描目录：'+(r.roots||[]).join('；')+((r.errors||[]).length?'\n'+r.errors.map(x=>x.error).join('\n'):'');box.appendChild(note);
    for(const row of r.skills||[]){
      const item=document.createElement('div');item.className='meta';item.style.padding='10px';
      const label=document.createElement('div');label.textContent=row.name+'\n'+row.path+(row.error?'\n'+row.error:'');item.appendChild(label);
      const button=document.createElement('button');button.className='btn';button.textContent='选择存储';button.disabled=row.readable===false;
      button.onclick=()=>{$('#skillPath').value=row.path;};item.appendChild(button);box.appendChild(item);
    }
  }catch(e){toast('Skill 读取失败：'+e.message,true);}
}

async function refreshSkillPackages(){
  try{
    const r=await api('/api/stored-skills?storage='+encodeURIComponent($('#skillStorageRoot').value.trim()));
    const box=$('#skillPackages');box.innerHTML='';
    for(const row of r.packages||[]){
      const item=document.createElement('div');item.className='meta';item.style.padding='10px';
      const label=document.createElement('div');label.textContent=row.error ? row.path+'\n'+row.error :
        (AGENTS[row.agent]||row.agent)+' · '+(row.skill?.name||'Skill')+'\n'+row.path;item.appendChild(label);
      if(!row.error){const button=document.createElement('button');button.className='btn';button.textContent='选择恢复';
        button.onclick=()=>{$('#skillPackage').value=row.path;$('#skillTargetAgent').value=row.agent;};item.appendChild(button);}
      box.appendChild(item);
    }
    if(!(r.packages||[]).length) box.textContent='暂无 Skill 包。默认目录：'+r.root;
  }catch(e){toast('Skill 存储列表读取失败：'+e.message,true);}
}

async function storeSelectedSkill(){
  if(state.transferring) return;
  const payload={agent:$('#skillAgent').value,path:$('#skillPath').value.trim(),storage:$('#skillStorageRoot').value.trim()||null};
  if(!payload.path) return toast('请选择包含 SKILL.md 的 Skill 目录',true);
  state.transferring=true;$('#storeSkill').disabled=true;updateActions();
  try{
    const r=await api('/api/store-skill',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    $('#skillResult').textContent='已存储 '+r.manifest.skill.name+'\n包路径：'+r.path+
      ((r.manifest.excluded||[]).length?'\n已排除：'+r.manifest.excluded.join('、'):'');
    await refreshSkillPackages();
  }catch(e){toast('Skill 存储失败：'+e.message,true);}
  finally{state.transferring=false;$('#storeSkill').disabled=false;updateActions();}
}

async function restoreSelectedSkill(){
  if(state.transferring) return;
  const payload={package:$('#skillPackage').value.trim(),agent:$('#skillTargetAgent').value,
    skills_dir:$('#targetSkillsDir').value.trim()||null,name:$('#skillName').value.trim()||null};
  if(!payload.package) return toast('填写 Skill 包路径',true);
  state.transferring=true;$('#restoreSkill').disabled=true;updateActions();
  try{
    const r=await api('/api/restore-skill',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    $('#skillResult').textContent='已恢复 '+r.name+'\n目录：'+r.path+'\n'+(r.notes||[]).join('\n');
  }catch(e){toast('Skill 恢复失败：'+e.message,true);}
  finally{state.transferring=false;$('#restoreSkill').disabled=false;updateActions();}
}

async function storeCurrent(){
  const selected=state.current;
  if(!selected || $('#btnStore').disabled || state.transferring) return;
  state.transferring=true; updateActions();
  try{
    const r=await api('/api/store-session',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({source:selected.source,id:selected.id,storage:$('#storageRoot').value.trim()||null})});
    $('#storagePanel').style.display='';
    $('#storageResult').textContent='已存储 '+AGENTS[r.manifest.agent]+' 会话\n包路径：'+r.path+'\n复制此 ZIP 包或整个 storage 文件夹到另一台设备后恢复。';
    await refreshStorage();
  }catch(e){toast('存储失败：'+e.message,true);}
  finally{state.transferring=false;updateActions();}
}

async function refreshStorage(){
  try{
    const r=await api('/api/stored-sessions?storage='+encodeURIComponent($('#storageRoot').value.trim()));
    const box=$('#storageList'); box.innerHTML='';
    for(const row of r.packages||[]){
      const item=document.createElement('div'); item.className='meta'; item.style.padding='10px';
      const details=document.createElement('div');
      details.textContent=row.error ? row.path+'\n读取失败：'+row.error :
        (AGENTS[row.agent]||row.agent)+' · '+(row.session?.title||row.session?.id||'会话')+'\n'+row.path;
      item.appendChild(details);
      if(!row.error){
        const button=document.createElement('button'); button.className='btn'; button.textContent='选择恢复';
        button.onclick=()=>{$('#packagePath').value=row.path;}; item.appendChild(button);
      }
      box.appendChild(item);
    }
    if(!(r.packages||[]).length) box.textContent='暂无已存储会话。默认目录：'+r.root;
  }catch(e){toast('存储列表读取失败：'+e.message,true);}
}

async function restoreStored(){
  const payload={package:$('#packagePath').value.trim(),cwd:$('#restoreCwd').value.trim(),session_id:$('#restoreId').value.trim()||null};
  if(state.transferring) return;
  if(!payload.package || !payload.cwd) return toast('填写会话包路径和本机目标项目目录',true);
  state.transferring=true; $('#restorePackage').disabled=true; updateActions();
  try{
    const r=await api('/api/restore-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    $('#storageResult').textContent='已恢复 '+AGENTS[r.to.source]+'\n会话 ID：'+r.to.native_id+'\n文件：'+r.to.path+
      (r.resume_command?'\n续聊命令：'+r.resume_command:'')+'\n'+(r.notes||[]).join('\n');
    await loadSources();
  }catch(e){toast('恢复失败：'+e.message,true);}
  finally{state.transferring=false;$('#restorePackage').disabled=false;updateActions();}
}

async function doImportWindows(){
  const selected = state.current;
  const btn = $('#btnImport');
  const mode = selected && nativeMode(selected.source);
  if(!selected || btn.disabled || state.transferring || !mode) return;
  const payload = {source:selected.source, id:selected.id, cwd:$('#cwd').value.trim(),
                   session_id:$('#importId').value.trim() || null};
  if(mode==='export-windows') payload.project_path = $('#projectPath').value.trim();
  if(!payload.cwd) return toast('请先填写目标项目目录',true);
  state.transferring = true;
  const old = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> 导入中…';
  updateActions();
  try{
    const r = await api('/api/'+mode,{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)
    });
    const result = $('#importResult');
    result.innerHTML = '';
    const details = document.createElement('div');
    const targetOS = r.target_os || (mode==='import-windows' ? 'Ubuntu' : 'Windows');
    details.textContent = `已迁到 ${targetOS} ${AGENTS[r.to.source.replace(/^(windows_|ubuntu_)/,'')]}\n会话 ID：${r.to.native_id}\n文件：${r.to.path}` +
      (r.resume_command ? '\n续聊命令：'+r.resume_command : '') + '\n' + (r.notes||[]).join('\n');
    result.appendChild(details);
    const button = document.createElement('button');
    button.className = 'btn';
    button.textContent = '查看 '+targetOS+' 会话';
    button.onclick = async()=>{
      try{
        state.source = r.to.source;
        await loadSources();
        buildTabs();
        await loadSessions();
        const row = state.sessions.find(s=>s.id===r.to.id);
        if(row) await openSession(row);
        else toast('请在目标来源中按会话 ID 搜索',true);
      }catch(e){toast('刷新失败：'+e.message,true);}
    };
    result.appendChild(button);
    result.style.display = '';
    toast('已迁到 '+targetOS+' 对应软件');
    await loadSources();
  }catch(e){toast('导入失败：'+e.message,true);}
  finally{
    state.transferring = false;
    btn.innerHTML = old;
    updateActions();
  }
}

async function doTransfer(){
  const btn = $('#btnGo');
  if(!state.current || btn.disabled) return;
  state.transferring = true;
  const old = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> 迁移中…';
  btn.disabled = true;
  updateActions();
  const payload = {
    source: state.current.source,
    id: state.current.id,
    target: state.target,
    cwd: (nativeMode(state.current.source)==='export-windows' ? $('#projectPath').value : $('#cwd').value).trim() || null,
    remap_tools: $('#remap').checked,
    include_thinking: $('#think').checked,
  };
  let r;
  try{
    r = await api('/api/transfer', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
    });
  }catch(e){
    return toast('迁移失败：'+e.message, true);
  }finally{
    state.transferring = false;
    btn.innerHTML = old;
    updateActions();
  }
  const p = r.to.path;
  toast(`已迁移到 ${AGENTS[r.to.source]}：${p}`, false, {
    label:'复制路径',
    fn:()=>{ navigator.clipboard?.writeText(p).then(()=>toast('路径已复制'),()=>{}); }
  });
  loadSources().catch(e=>toast('刷新失败：'+e.message, true));
}

function download(name, text){
  const b = new Blob([text], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

init().catch(e=>{
  $('#list').innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  toast('加载失败：'+e.message, true);
});
</script>
