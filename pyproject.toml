[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-relay-portable"
description = "Local conversation migration and portable conversation/Skill storage for AI coding assistants."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dynamic = ["version"]

[project.optional-dependencies]
dsh = ["zstandard>=0.23.0,<1"]

[project.scripts]
relay = "cli:main"
agent-relay = "cli:main"

# 主要分发方式仍是源码目录 + 启动器（U 盘便携版）；下面让它同时可以 `pipx install` / `pip install`。
# 安装后数据放在每用户目录（见 relay/runtime.py），不会写进 site-packages。
[tool.setuptools]
package-dir = { "" = "app", "relay_web" = "app/web" }
py-modules = ["bootstrap", "cli", "server", "portable"]
packages = ["relay", "relay.adapters", "relay_web"]

[tool.setuptools.package-data]
relay_web = ["*.html", "*.css", "*.js", "*.svg", "*.png", "*.ico"]

[tool.setuptools.dynamic]
version = { attr = "relay.__version__" }

[tool.ruff]
target-version = "py38"
line-length = 120
extend-exclude = ["runtime", "build", "dist", "storage", "index", "devices"]

[tool.ruff.lint]
# 逐步收紧：语法错误、未使用/未定义名称、bugbear 中的真实隐患、典型比较/裸 except 问题。
select = ["E9", "F", "B", "E711", "E712", "E721", "E722"]
ignore = [
    "B008",  # 默认参数里的函数调用
    "B011",
    "B017",  # 测试里的 assertRaises(Exception)
]

[tool.mypy]
files = ["app"]
ignore_missing_imports = true
# 基线：下面这些错误码在历史代码里仍有存量（主要是 Optional 收窄），暂时关闭，
# 其余错误码（未定义名称、参数个数、返回值等）已强制检查。逐步清理后从这里删除。
disable_error_code = [
    "union-attr", "arg-type", "assignment", "call-overload", "misc",
    "has-type", "attr-defined", "type-var", "dict-item", "no-redef", "return-value",
]

[tool.coverage.run]
source = ["app"]
branch = false

[tool.coverage.report]
fail_under = 75
skip_empty = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
